name: smart_gallery
description: A professional, modular Android gallery app inspired by Samsung Gallery.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.3+1  # ✅ الإصدار الصحيح للويب
  path: ^1.9.0
  path_provider: ^2.1.3

  # Media / storage
  photo_manager: ^3.2.0
  photo_manager_image_provider: ^1.0.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Biometric
  local_auth: ^2.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Sharing
  share_plus: ^9.0.0

  # Video
  video_player: ^2.9.1

  # Image editing
  image: ^4.2.0

  # Utils
  collection: ^1.18.0
  uuid: ^4.4.0
  logging: ^1.2.3
  visibility_detector: ^0.4.0+2

  # Supabase (backup provider, optional)
  #supabase_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true


